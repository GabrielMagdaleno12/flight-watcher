name: Coletar preços

on:
  schedule:
    - cron: '*/15 * * * *'   # o GitHub pode atrasar alguns minutos
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar intervalos e rodar todas as buscas'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Coletar
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node src/run.js
      - name: Commitar dados
        run: |
          git config user.name "flight-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
